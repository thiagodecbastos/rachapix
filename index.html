<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dividee - Dividir Contas, Churrascos e Despesas em Grupo via Pix</title>
    
    <!-- Script de Verificação Oficial do Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4447218246982102" crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <div class="max-w-md w-full mx-auto bg-white shadow-xl flex-1 flex flex-col justify-between" x-data="{
        eventName: '',
        newParticipantName: '',
        newParticipantPix: '',
        participants: [],
        expenseDesc: '',
        expenseAmount: '',
        expensePayer: '',
        expenses: [],
        calculatedDebts: [],

        addParticipant() {
            if (this.newParticipantName && this.newParticipantName.trim() !== '') {
                let name = this.newParticipantName.trim();
                if (!this.participants.some(p => p.name === name)) {
                    this.participants.push({
                        name: name,
                        pix: this.newParticipantPix ? this.newParticipantPix.trim() : ''
                    });
                    this.newParticipantName = '';
                    this.newParticipantPix = '';
                }
            }
        },

        removeParticipant(index) {
            this.participants.splice(index, 1);
            this.calculatedDebts = [];
        },

        addExpense() {
            if (this.expenseDesc && this.expenseAmount > 0 && this.expensePayer) {
                this.expenses.push({
                    desc: this.expenseDesc,
                    amount: parseFloat(this.expenseAmount),
                    payer: this.expensePayer
                });
                this.expenseDesc = '';
                this.expenseAmount = '';
                this.expensePayer = '';
                this.calculateDebts();
            }
        },

        removeExpense(index) {
            this.expenses.splice(index, 1);
            this.calculateDebts();
        },

        calculateDebts() {
            if (this.participants.length === 0 || this.expenses.length === 0) {
                this.calculatedDebts = [];
                return;
            }

            let balances = {};
            this.participants.forEach(p => balances[p.name] = 0);

            let totalSpent = 0;
            this.expenses.forEach(exp => {
                totalSpent += exp.amount;
                balances[exp.payer] += exp.amount;
            });

            let sharePerPerson = totalSpent / this.participants.length;

            this.participants.forEach(p => {
                balances[p.name] -= sharePerPerson;
            });

            let debtors = [];
            let creditors = [];

            for (let p in balances) {
                let bal = Math.round(balances[p] * 100) / 100;
                if (bal < -0.01) debtors.push({ name: p, amount: -bal });
                else if (bal > 0.01) creditors.push({ name: p, amount: bal });
            }

            let debts = [];
            let i = 0, j = 0;

            while (i < debtors.length && j < creditors.length) {
                let debtor = debtors[i];
                let creditor = creditors[j];
                let amt = Math.min(debtor.amount, creditor.amount);
                amt = Math.round(amt * 100) / 100;

                debts.push({ from: debtor.name, to: creditor.name, amount: amt });

                debtor.amount -= amt;
                creditor.amount -= amt;

                if (debtor.amount < 0.01) i++;
                if (creditor.amount < 0.01) j++;
            }

            this.calculatedDebts = debts;
        },

        copyPixInfo(amount, creditorName) {
            let creditor = this.participants.find(p => p.name === creditorName);
            let pixKey = creditor && creditor.pix ? creditor.pix : 'Chave Pix não informada';
            let textToCopy = `Pix para ${creditorName}: ${pixKey} \vert{} Valor: R$ ${amount.toFixed(2)} (${this.eventName || 'Dividee'})`;
            navigator.clipboard.writeText(textToCopy);
            alert(`Dados copiados para ${creditorName}!\n\nCole no seu banco:\n${textToCopy}`);
        },

        shareWhatsApp() {
            let eventTitle = this.eventName || 'Churrasco / Viagem';
            let total = this.expenses.reduce((acc, curr) => acc + curr.amount, 0);
            
            let lines = [];
            lines.push(`🧾 *Dividee: ${eventTitle}*`);
            lines.push(``);
            lines.push(`👥 Participantes: ${this.participants.length}`);
            lines.push(`💵 Total Gasto: R$ ${total.toFixed(2)}`);
            lines.push(``);
            
            if (this.calculatedDebts.length > 0) {
                lines.push(`🔄 *Acertos para pagamento:*`);
                this.calculatedDebts.forEach(d => {
                    let creditor = this.participants.find(p => p.name === d.to);
                    let pixKey = creditor && creditor.pix ? creditor.pix : 'Não informada';
                    lines.push(``);
                    lines.push(`• *${d.from}* deve *R$ ${d.amount.toFixed(2)}* para *${d.to}*`);
                    lines.push(`  📲 Pix (${d.to}):${pixKey}`);
                });
            } else {
                lines.push(`Nenhum acerto pendente.`);
            }

            lines.push(``);
            lines.push(`🚀 *Organizado com Dividee*`);

            let text = lines.join('\n');
            let encoded = encodeURIComponent(text);
            window.open(`https://wa.me/?text=${encoded}`, '_blank');
        }
    }">
        
        <!-- Header -->
        <header class="bg-emerald-600 text-white p-6 shadow-md">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-receipt"></i> Dividee
                </h1>
                <span class="text-xs bg-emerald-700 px-2 py-1 rounded-full font-medium">v2.10</span>
            </div>
            <p class="text-emerald-100 text-sm mt-1">Divida contas de churrascos e viagens sem enrolação.</p>
        </header>

        <!-- Conteúdo Principal -->
        <main class="p-5 space-y-6 flex-1">

            <!-- Passo 1: Dados do Evento -->
            <section class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <h2 class="font-semibold text-slate-700 text-sm uppercase tracking-wider">1. Dados do Evento</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nome do Evento / Viagem</label>
                    <input type="text" x-model="eventName" placeholder="Ex: Churrasco de Sábado" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                </div>
            </section>

            <!-- Passo 2: Participantes e Chaves Pix -->
            <section class="space-y-3">
                <h2 class="font-semibold text-slate-700 text-sm uppercase tracking-wider">2. Participantes (<span x-text="participants.length"></span>)</h2>
                
                <div class="space-y-2 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <input type="text" x-model="newParticipantName" @keyup.enter="addParticipant" placeholder="Nome do participante (Ex: João)" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white mb-2">
                    <input type="text" x-model="newParticipantPix" @keyup.enter="addParticipant" placeholder="Chave Pix (CPF, Celular ou E-mail)" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white mb-3">
                    <button type="button" @click="addParticipant" class="w-full bg-slate-800 text-white py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition">Adicionar ao Grupo</button>
                </div>

                <div class="space-y-2 mt-2">
                    <template x-for="(p, index) in participants" :key="index">
                        <div class="bg
