<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dividee - Divisão de Despesas Simples</title>
    
    <!-- Script de Verificação do Google AdSense -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-O_SEU_ID_AQUI" crossorigin="anonymous"></script> -->

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <div class="max-w-md w-full mx-auto bg-white shadow-xl flex-1 flex flex-col justify-between" x-data="{
        eventName: '',
        newParticipantName: '',
        newParticipantPix: '',
        participants: [],
        expenseDesc: '',
        expenseAmount: '',
        expensePayer: '',
        expenses: [],
        calculatedDebts: [],

        addParticipant() {
            if (this.newParticipantName && this.newParticipantName.trim() !== '') {
                let name = this.newParticipantName.trim();
                if (!this.participants.some(p => p.name === name)) {
                    this.participants.push({
                        name: name,
                        pix: this.newParticipantPix ? this.newParticipantPix.trim() : ''
                    });
                    this.newParticipantName = '';
                    this.newParticipantPix = '';
                }
            }
        },

        removeParticipant(index) {
            this.participants.splice(index, 1);
            this.calculatedDebts = [];
        },

        addExpense() {
            if (this.expenseDesc && this.expenseAmount > 0 && this.expensePayer) {
                this.expenses.push({
                    desc: this.expenseDesc,
                    amount: parseFloat(this.expenseAmount),
                    payer: this.expensePayer
                });
                this.expenseDesc = '';
                this.expenseAmount = '';
                this.expensePayer = '';
                this.calculateDebts();
            }
        },

        removeExpense(index) {
            this.expenses.splice(index, 1);
            this.calculateDebts();
        },

        calculateDebts() {
            if (this.participants.length === 0 || this.expenses.length === 0) {
                this.calculatedDebts = [];
                return;
            }

            let balances = {};
            this.participants.forEach(p => balances[p.name] = 0);

            let totalSpent = 0;
            this.expenses.forEach(exp => {
                totalSpent += exp.amount;
                balances[exp.payer] += exp.amount;
            });

            let sharePerPerson = totalSpent / this.participants.length;

            this.participants.forEach(p => {
                balances[p.name] -= sharePerPerson;
            });

            let debtors = [];
            let creditors = [];

            for (let p in balances) {
                let bal = Math.round(balances[p] * 100) / 100;
                if (bal < -0.01) debtors.push({ name: p, amount: -bal });
                else if (bal > 0.01) creditors.push({ name: p, amount: bal });
            }

            let debts = [];
            let i = 0, j = 0;

            while (i < debtors.length && j < creditors.length) {
                let debtor = debtors[i];
                let creditor = creditors[j];
                let amt = Math.min(debtor.amount, creditor.amount);
                amt = Math.round(amt * 100) / 100;

                debts.push({ from: debtor.name, to: creditor.name, amount: amt });

                debtor.amount -= amt;
                creditor.amount -= amt;

                if (debtor.amount < 0.01) i++;
                if (creditor.amount < 0.01) j++;
            }

            this.calculatedDebts = debts;
        },

        copyPixInfo(amount, creditorName) {
            let creditor = this.participants.find(p => p.name === creditorName);
            let pixKey = creditor && creditor.pix ? creditor.pix : 'Chave Pix não informada';
            let textToCopy = `Pix para ${creditorName}: ${pixKey} \vert{} Valor: R$ ${amount.toFixed(2)} (${this.eventName || 'Dividee'})`;
            navigator.clipboard.writeText(textToCopy);
            alert(`Dados copiados para ${creditorName}!\n\nCole no seu banco:\n${textToCopy}`);
        },

        shareWhatsApp() {
            let eventTitle = this.eventName || 'Churrasco / Viagem';
            let total = this.expenses.reduce((acc, curr) => acc + curr.amount, 0);
            
            let lines = [];
            lines.push(`🧾 *Dividee: ${eventTitle}*`);
            lines.push(``);
            lines.push(`👥 Participantes: ${this.participants.length}`);
            lines.push(`💵 Total Gasto: R$ ${total.toFixed(2)}`);
            lines.push(``);
            
            if (this.calculatedDebts.length > 0) {
                lines.push(`🔄 *Acertos para pagamento:*`);
                this.calculatedDebts.forEach(d => {
                    let creditor = this.participants.find(p => p.name === d.to);
                    let pixKey = creditor && creditor.pix ? creditor.pix : 'Não informada';
                    lines.push(``);
                    lines.push(`• *${d.from}* deve *R$ ${d.amount.toFixed(2)}* para *${d.to}*`);
                    lines.push(`  📲 Pix (${d.to}):${pixKey}`);
                });
            } else {
                lines.push(`Nenhum acerto pendente.`);
            }

            lines.push(``);
            lines.push(`*Organizado gratuitamente com o Dividee* 🚀`);
            lines.push(`https://dividee.com.br`);

            let text = lines.join('\n');
            let encoded = encodeURIComponent(text);
            window.open(`https://wa.me/?text=${encoded}`, '_blank');
        }
    }">
        
        <!-- Header -->
        <header class="bg-emerald-600 text-white p-6 shadow-md">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-receipt"></i> Dividee
                </h1>
                <span class="text-xs bg-emerald-700 px-2 py-1 rounded-full font-medium">v2.8</span>
            </div>
            <p class="text-emerald-100 text-sm mt-1">Divida contas de churrascos e viagens sem enrolação.</p>
        </header>

        <!-- Conteúdo Principal -->
        <main class="p-5 space-y-6 flex-1">

            <!-- Passo 1: Dados do Evento -->
            <section class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <h2 class="font-semibold text-slate-700 text-sm uppercase tracking-wider">1. Dados do Evento</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nome do Evento / Viagem</label>
                    <input type="text" x-model="eventName" placeholder="Ex: Churrasco de Sábado" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                </div>
            </section>

            <!-- Passo 2: Participantes e Chaves Pix -->
            <section class="space-y-3">
                <h2 class="font-semibold text-slate-700 text-sm uppercase tracking-wider">2. Participantes (<span x-text="participants.length"></span>)</h2>
                
                <div class="space-y-2 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <input type="text" x-model="newParticipantName" @keyup.enter="addParticipant" placeholder="Nome do participante (Ex: João)" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white mb-2">
                    <input type="text" x-model="newParticipantPix" @keyup.enter="addParticipant" placeholder="Chave Pix (CPF, Celular ou E-mail)" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white mb-3">
                    <button type="button" @click="addParticipant" class="w-full bg-slate-800 text-white py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition">Adicionar ao Grupo</button>
                </div>

                <div class="space-y-2 mt-2">
                    <template x-for="(p, index) in participants" :key="index">
                        <div class="bg-emerald-50 text-emerald-900 text-xs p-3 rounded-xl border border-emerald-200 flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm" x-text="p.name"></p>
                                <p class="text-slate-500 text-xs">Pix: <span x-text="p.pix || 'Não informada'"></span></p>
                            </div>
                            <button type="button" @click="removeParticipant(index)" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash-can text-sm"></i></button>
                        </div>
                    </template>
                </div>
            </section>

            <!-- Passo 3: Lançar Despesas -->
            <section class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200" x-show="participants.length > 0">
                <h2 class="font-semibold text-slate-700 text-sm uppercase tracking-wider">3. Lançar Gastos</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Descrição do Gasto</label>
                    <input type="text" x-model="expenseDesc" placeholder="Ex: Supermercado / Combustível" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Valor (R$)</label>
                        <input type="number" step="0.01" x-model.number="expenseAmount" placeholder="0,00" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Quem pagou?</label>
                        <select x-model="expensePayer" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="">Selecione...</option>
                            <template x-for="p in participants">
                                <option :value="p.name" x-text="p.name"></option>
                            </template>
                        </select>
                    </div>
                </div>
                <button type="button" @click="addExpense" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-emerald-700 transition shadow-sm">
                    Adicionar Despesa
                </button>
            </section>

            <!-- Lista de Despesas Lançadas -->
            <section class="space-y-2" x-show="expenses.length > 0">
                <h2 class="font-semibold text-slate-700 text-sm uppercase tracking-wider">Extrato de Gastos</h2>
                <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <template x-for="(exp, index) in expenses" :key="index">
                        <div class="flex justify-between items-center bg-white p-3 rounded-lg border border-slate-100 shadow-xs text-sm">
                            <div>
                                <p class="font-medium text-slate-800" x-text="exp.desc"></p>
                                <p class="text-xs text-slate-500">Pago por <span class="font-semibold text-emerald-600" x-text="exp.payer"></span></p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-slate-700">R$ <span x-text="exp.amount.toFixed(2)"></span></span>
                                <button type="button" @click="removeExpense(index)" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    </template>
                </div>
            </section>

            <!-- Passo 4: Acerto de Contas (Resultado) -->
            <section class="space-y-3 pt-2 border-t border-slate-200" x-show="expenses.length > 0">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-slate-800 text-base">4. Acerto via Pix</h2>
                    <button type="button" @click="calculateDebts" class="bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg font-medium hover:bg-slate-800 transition">Calcular Divisão</button>
                </div>

                <div class="space-y-3">
                    <template x-for="debt in calculatedDebts">
                        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl flex flex-col gap-2">
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-slate-700"><strong x-text="debt.from"></strong> deve para <strong x-text="debt.to"></strong></span>
                                <span class="font-bold text-emerald-700 text-base">R$ <span x-text="debt.amount.toFixed(2)"></span></span>
                            </div>
                            <button type="button" @click="copyPixInfo(debt.amount, debt.to)" class="w-full bg-emerald-600 text-white py-1.5 rounded-lg text-xs font-semibold hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-qrcode"></i> Copiar Chave Pix de <span x-text="debt.to"></span> e Valor
                            </button>
                        </div>
                    </template>
                </div>
            </section>

            <!-- Passo 5: Partilhar no WhatsApp -->
            <section class="pt-2" x-show="calculatedDebts.length > 0">
                <button type="button" @click="shareWhatsApp" class="w-full bg-emerald-600 text-white py-3 rounded-xl text-sm font-bold hover:bg-emerald-700 transition flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Partilhar Acertos no WhatsApp
                </button>
            </section>

        </main>

        <!-- Rodapé com Links Legais -->
        <footer class="bg-slate-100 text-center py-4 text-xs text-slate-500 border-t border-slate-200 space-y-1">
            <p>Dividee — Simples, rápido e direto ao ponto.</p>
            <div class="space-x-2">
                <a href="termos.html" class="underline hover:text-slate-700">Termos de Uso</a>
                <span>•</span>
                <a href="privacidade.html" class="underline hover:text-slate-700">Política de Privacidade</a>
            </div>
        </footer>

    </div>

</body>
</html>
