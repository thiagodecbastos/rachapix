<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <div class="max-w-md w-full mx-auto bg-white shadow-xl flex-1 flex flex-col justify-between" x-data="{
        eventName: '',
        newParticipantName: '',
        newParticipantPix: '',
        participants: [],
        expenseDesc: '',
        expenseAmount: '',
        expensePayer: '',
        expenses: [],
        calculatedDebts: [],

        addParticipant() {
            if (this.newParticipantName && this.newParticipantName.trim() !== '') {
                let name = this.newParticipantName.trim();
                if (!this.participants.some(p => p.name === name)) {
                    this.participants.push({
                        name: name,
                        pix: this.newParticipantPix ? this.newParticipantPix.trim() : ''
                    });
                    this.newParticipantName = '';
                    this.newParticipantPix = '';
                }
            }
        },

        removeParticipant(index) {
            this.participants.splice(index, 1);
            this.calculatedDebts = [];
        },

        addExpense() {
            if (this.expenseDesc && this.expenseAmount > 0 && this.expensePayer) {
                this.expenses.push({
                    desc: this.expenseDesc,
                    amount: parseFloat(this.expenseAmount),
                    payer: this.expensePayer
                });
                this.expenseDesc = '';
                this.expenseAmount = '';
                this.expensePayer = '';
                this.calculateDebts();
            }
        },

        removeExpense(index) {
            this.expenses.splice(index, 1);
            this.calculateDebts();
        },

        calculateDebts() {
            if (this.participants.length === 0 || this.expenses.length === 0) {
                this.calculatedDebts = [];
                return;
            }
